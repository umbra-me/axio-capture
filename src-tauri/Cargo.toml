[package]
name = "axio-capture"
version = "0.1.0"
edition = "2024"
description = "Region screenshots with an annotation editor, for people and agents"
license = "Apache-2.0"
repository = "https://github.com/umbra-me/axio-capture"
rust-version = "1.85"

[lib]
name = "axio_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1"
arboard = "3.6"
chrono = "0.4"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2.4"
rand = "0.9"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-updater = "2.10"
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics"] }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

# Tauri decides dev-vs-production from this feature, not from the cargo profile.
# `tauri build` passes it automatically; a bare `cargo build --release` does not.
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
